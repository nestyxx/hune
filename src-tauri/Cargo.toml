[package]
name = "hune"
version = "0.20.0"
description = "Hune : suivi de cryptos et d'actions (graphiques, indicateurs, alertes, portefeuille), en lecture seule"
authors = ["nestyxx"]
edition = "2024"

[lib]
# Le suffixe « _lib » évite un conflit de noms sous Windows (voir rust-lang/cargo#8519).
name = "hune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "builder", "rustls", "ring", "webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
